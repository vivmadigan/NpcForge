<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NpcForge: the sketch epic 12 starts from</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IM+Fell+English&family=Crimson+Text&display=swap" rel="stylesheet">
<style>
  body { margin: 0; padding: 24px; background: #0a0606; }
  .frame { max-width: 680px; margin: 0 auto; background: #120a0a; border: 4px solid #5a1a14; padding: 16px; color: #e8dccb; }
  .pixel { font-family: 'Press Start 2P', monospace; }
  .bar { display: flex; justify-content: space-between; font-size: 12px; color: #ff5a36; margin-bottom: 14px; }
  .bar .saved { color: #8a6a55; }
  .scene { background: #1e1110; border: 2px solid #7a2a1c; padding: 10px 12px; font-family: 'Crimson Text', serif; font-size: 16px; margin-bottom: 10px; color: #b9a898; }
  .sheet { background: #eadfc8; color: #2a1a12; border: 2px solid #b3401f; padding: 12px 14px; margin-bottom: 12px; font-family: 'IM Fell English', serif; }
  .sheet .name { font-size: 11px; color: #8f2415; margin-bottom: 8px; }
  .sheet .text { font-size: 17px; line-height: 1.5; }
  .buttons { display: flex; gap: 8px; font-size: 11px; }
  .save { background: #c8321e; color: #fff3e0; padding: 8px 10px; border: 2px solid #ff7a4d; }
  .again { border: 2px solid #7a2a1c; padding: 8px 10px; }
</style>
</head>
<body>
<div class="frame">
  <div class="bar pixel"><span>NPCFORGE</span><span class="saved">SAVED: 16</span></div>
  <div class="scene">An inn in a major city. We want the name of a fence.</div>
  <div class="sheet">
    <div class="name pixel">NELL FAIRCHILD</div>
    <div class="text">She tends to her work with worn patience, tilting her head as she listens. "Welcome, love. Take a breath; I'll find you something warm."</div>
  </div>
  <div class="buttons pixel"><span class="save">SAVE</span><span class="again">ROLL AGAIN</span></div>
</div>
</body>
</html>
